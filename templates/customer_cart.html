{% extends "base.html" %}

{% block title %}Shopping Cart - Aneri Beauty Care{% endblock %}

{% block content %}
<div class="cart-page py-5">
    <div class="container">
        <h2 class="mb-4"><i class="bi bi-cart3"></i> Shopping Cart</h2>
        
        <div class="row">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body" id="cartItems">
                        <div class="text-center text-muted py-5">
                            <i class="bi bi-cart-x" style="font-size: 4rem;"></i>
                            <p class="mt-3">Your cart is empty</p>
                            <a href="{{ url_for('main.customer_products') }}" class="btn btn-primary">
                                Start Shopping
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Cart Summary</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal:</span>
                            <span id="subtotal">₹0.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Tax:</span>
                            <span id="tax">₹0.00</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-3">
                            <strong>Total:</strong>
                            <strong id="total">₹0.00</strong>
                        </div>
                        <button class="btn btn-primary w-100" id="checkoutBtn" disabled>
                            Proceed to Checkout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    renderCart();

    let pendingRazorpayOrder = null;
    let pendingOrderTotal = null;
    let razorpayInstance = null;

    document.getElementById('checkoutBtn').addEventListener('click', async function() {
        const cart = window.CartManager.getCart();
        if (!cart || cart.length === 0) return;

        // require auth
        if (!window.authManager.isAuthenticated()) {
            // redirect to login
            localStorage.setItem('post_login_redirect', window.location.pathname);
            window.location.href = window.APP_CONFIG.URLS.login;
            return;
        }

        // If cart changed, clear pending Razorpay order
        if (window.CartManager.cartChangedSinceOrder) {
            pendingRazorpayOrder = null;
            pendingOrderTotal = null;
            razorpayInstance = null;
            window.CartManager.cartChangedSinceOrder = false;
        }

        try {
            LoadingOverlay.show('Processing payment...');
            if (!pendingRazorpayOrder) {
                // create razorpay order on server (pass cart total)
                // You may need to implement an endpoint to create a Razorpay order directly from cart total
                // For now, reuse your existing API but do NOT create your backend order here
                const cartTotal = window.CartManager.getTotal();
                const tax = parseFloat((cartTotal * 0.05).toFixed(2));
                const grandTotal = cartTotal + tax;
                // Call your backend to create a Razorpay order for grandTotal
                // Ensure the API client uses the correct endpoint: /payments/razorpay/create_order_from_amount
                try {
                    pendingRazorpayOrder = await window.apiClient.createRazorpayOrderFromAmount(grandTotal);
                } catch (err) {
                    LoadingOverlay.hide();
                    Toast.error(err.message || 'Failed to create payment order. Please try again or contact support.');
                    return;
                }
                pendingOrderTotal = grandTotal;
            }
            LoadingOverlay.hide();
            if (!pendingRazorpayOrder || !pendingRazorpayOrder.razorpay_order) {
                Toast.error('Failed to create payment order');
                pendingRazorpayOrder = null;
                pendingOrderTotal = null;
                razorpayInstance = null;
                return;
            }

            // load razorpay checkout
            const amountPaise = Math.round(pendingOrderTotal * 100);
            const options = {
                key: pendingRazorpayOrder.key_id,
                amount: amountPaise,
                currency: (pendingRazorpayOrder.razorpay_order && pendingRazorpayOrder.razorpay_order.currency) || 'INR',
                name: 'Aneri BeautyCare',
                description: 'Cart Payment',
                order_id: pendingRazorpayOrder.razorpay_order.id,
                handler: async function (response){
                    try {
                        LoadingOverlay.show('Placing order...');
                        // Now create backend order only after payment
                        const cart = window.CartManager.getCart();
                        const order = await window.apiClient.syncCartAndCreateOrder(cart);
                        await window.apiClient.verifyRazorpayPayment({
                            order_id: order.id,
                            razorpay_order_id: response.razorpay_order_id,
                            razorpay_payment_id: response.razorpay_payment_id,
                            razorpay_signature: response.razorpay_signature
                        });
                        LoadingOverlay.hide();
                        Toast.success('Payment successful');
                        window.CartManager.clearCart();
                        pendingRazorpayOrder = null;
                        pendingOrderTotal = null;
                        razorpayInstance = null;
                        window.location.href = window.APP_CONFIG.URLS.customerDashboard;
                    } catch (err) {
                        LoadingOverlay.hide();
                        console.error(err);
                        Toast.error('Payment verification failed');
                    }
                },
                modal: {
                    ondismiss: function(){
                        // Do not clear pending Razorpay order so user can retry without creating new order
                    }
                }
            };

            razorpayInstance = new Razorpay(options);
            razorpayInstance.open();

        } catch (err) {
            LoadingOverlay.hide();
            console.error(err);
            Toast.error(err.message || 'Failed to place order');
        }
    });

    // Listen for cart changes to clear pending Razorpay order
    window.CartManager._origUpdateQuantity = window.CartManager.updateQuantity;
    window.CartManager.updateQuantity = function(id, qty) {
        window.CartManager.cartChangedSinceOrder = true;
        return window.CartManager._origUpdateQuantity(id, qty);
    };
    window.CartManager._origRemoveItem = window.CartManager.removeItem;
    window.CartManager.removeItem = function(id) {
        window.CartManager.cartChangedSinceOrder = true;
        return window.CartManager._origRemoveItem(id);
    };
    window.CartManager._origClearCart = window.CartManager.clearCart;
    window.CartManager.clearCart = function() {
        window.CartManager.cartChangedSinceOrder = true;
        return window.CartManager._origClearCart();
    };
});

function renderCart() {
    const cart = window.CartManager.getCart();
    const cartItemsEl = document.getElementById('cartItems');
    const subtotalEl = document.getElementById('subtotal');
    const taxEl = document.getElementById('tax');
    const totalEl = document.getElementById('total');
    const checkoutBtn = document.getElementById('checkoutBtn');

    if (!cart || cart.length === 0) {
        cartItemsEl.innerHTML = `
            <div class="text-center text-muted py-5">
                <i class="bi bi-cart-x" style="font-size: 4rem;"></i>
                <p class="mt-3">Your cart is empty</p>
                <a href="${window.APP_CONFIG.URLS.services}" class="btn btn-primary">Start Shopping</a>
            </div>
        `;
        subtotalEl.textContent = '₹0.00';
        taxEl.textContent = '₹0.00';
        totalEl.textContent = '₹0.00';
        checkoutBtn.disabled = true;
        return;
    }

    const rows = cart.map(item => {
        const hasOffer = item.applied_offer;
        const displayPrice = hasOffer ? item.price : item.original_price || item.price;
        
        return `
        <div class="d-flex align-items-center border rounded p-2 mb-2">
            <div class="me-3" style="width:64px; height:64px;">
                <img src="${item.image ? '/static/' + item.image : '/static/images/placeholder.svg'}" class="img-fluid rounded" />
            </div>
            <div class="flex-grow-1">
                <div class="fw-bold">${item.name}</div>
                <div class="text-muted small">
                    ${hasOffer ? `
                        <span class="text-success">₹${parseFloat(displayPrice).toFixed(2)}</span>
                        <span class="text-decoration-line-through ms-1">₹${parseFloat(item.original_price || item.price).toFixed(2)}</span>
                        <br><small class="text-success">${item.applied_offer.title}</small>
                    ` : `
                        ₹${parseFloat(displayPrice).toFixed(2)}
                    `}
                </div>
            </div>
            <div class="ms-3 text-center">
                <input type="number" min="1" value="${item.quantity}" data-id="${item.id}" class="form-control form-control-sm cart-qty" style="width:80px;" />
                <button class="btn btn-link text-danger btn-sm remove-item" data-id="${item.id}">Remove</button>
            </div>
        </div>
        `;
    }).join('');

    cartItemsEl.innerHTML = rows;

    // attach listeners
    document.querySelectorAll('.cart-qty').forEach(el => {
        el.addEventListener('change', (e) => {
            const id = parseInt(e.target.dataset.id);
            const qty = parseInt(e.target.value) || 1;
            window.CartManager.updateQuantity(id, qty);
            renderCart();
        });
    });

    document.querySelectorAll('.remove-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const id = parseInt(e.target.dataset.id);
            window.CartManager.removeItem(id);
            renderCart();
        });
    });

    const subtotal = window.CartManager.getTotal();
    const tax = parseFloat((subtotal * 0.05).toFixed(2));
    const total = subtotal + tax;

    subtotalEl.textContent = `₹${subtotal.toFixed(2)}`;
    taxEl.textContent = `₹${tax.toFixed(2)}`;
    totalEl.textContent = `₹${total.toFixed(2)}`;

    checkoutBtn.disabled = false;
}
</script>
{% endblock %}
